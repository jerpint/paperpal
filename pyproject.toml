[project]
name = "paperpal"
version = "0.2.0.dev0"
description = "ML literature research for agents and humans: top-tier search, arXiv/HF/Semantic Scholar, full-text verification, and gdoc-ready notes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.5.0",
    "markdown>=3.6",
]

[project.scripts]
paperpal = "paperpal.cli:main"
paperpal-mcp = "paperpal.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperpal"]

[dependency-groups]
dev = ["pytest>=8"]
